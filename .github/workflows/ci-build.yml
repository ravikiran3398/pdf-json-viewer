name: CI Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-backend:
    name: Backend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: pdf-json-backend/package-lock.json

      - name: Install Dependencies
        working-directory: ./pdf-json-backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./pdf-json-backend
        run: npx prisma generate

      - name: Build TypeScript
        working-directory: ./pdf-json-backend
        run: npm run build

  build-frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: pdf-json-frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./pdf-json-frontend
        run: npm ci

      - name: Build Vite App
        working-directory: ./pdf-json-frontend
        run: npm run build
